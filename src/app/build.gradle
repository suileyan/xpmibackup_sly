plugins {
    id 'com.android.application'
}

// release 签名：从根目录 keystore.properties 注入（HIGH-21）
// 文件不存在时 release 构建不配置签名，避免用 debug 密钥发布
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseKeystore = keystorePropsFile.exists()
if (hasReleaseKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// Google Drive 内置 OAuth 客户端：从根目录 gdrive.properties 注入。
// 该文件已在 .gitignore 中，凭据不会进入 git 历史（参考 keystore.properties 的同款做法）；
// 未配置时注入空串 → 登录页回退为「要求用户自填自己的 GCP 凭据」。
// 字段：clientId / clientSecret（GCP 控制台「桌面应用」类型 OAuth 客户端的两个值）
def gdriveProps = new Properties()
def gdrivePropsFile = rootProject.file('gdrive.properties')
def hasGdriveClient = gdrivePropsFile.exists()
if (hasGdriveClient) {
    gdrivePropsFile.withInputStream { gdriveProps.load(it) }
}
def gdriveClientId = hasGdriveClient ? (gdriveProps['clientId'] ?: '') : ''
def gdriveClientSecret = hasGdriveClient ? (gdriveProps['clientSecret'] ?: '') : ''
// 生成 Java 字符串字面量：转义反斜杠与引号，避免凭据里的特殊字符破坏 buildConfigField
def javaStr = { String s -> '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.suileyan.xpmibackup'
    compileSdk 37
    buildToolsVersion "37.0.0"

    defaultConfig {
        applicationId "com.suileyan.xpmibackup"
        // Android 11+（API 30）：isExternalStorageManager / MANAGE_EXTERNAL_STORAGE 分区存储路线的起点，
        // Android 9~10 的 legacy 存储权限分支已按 v0.9.1 决策移除（见 docs/ANDROID-VERSION-MATRIX.md）
        minSdk 30
        targetSdk 37
        versionCode 10100
        versionName "1.1.0"

        // Google Drive 内置 OAuth 客户端（空串 = 未配置，登录页会要求用户自填）
        buildConfigField "String", "GDRIVE_CLIENT_ID", javaStr(gdriveClientId)
        buildConfigField "String", "GDRIVE_CLIENT_SECRET", javaStr(gdriveClientSecret)
    }

    buildFeatures {
        // 仅为注入 Google Drive 内置 OAuth 凭据（GDRIVE_CLIENT_ID / GDRIVE_CLIENT_SECRET）而开启
        buildConfig true
    }

    // signingConfigs 必须在 buildTypes 之前声明（NEW-H-04）：
    // buildTypes 内引用 signingConfigs.release 时，配置必须已定义，否则提供 keystore 时抛 UnknownPropertyException
    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            v1SigningEnabled true
            v2SigningEnabled true
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 代码混淆（Xposed 入口与 Hook 类已在 proguard-rules.pro 中 keep）
            minifyEnabled false

            // 移除没用的资源文件
            shrinkResources false

            // 关闭调试选项
            debuggable false

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // 有 keystore.properties 时使用 release 签名，否则不签名（避免误用 debug 密钥）
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        resources {
            // 只排除许可声明类文件，保留 META-INF/services/**（ServiceLoader 依赖，MED-40）
            excludes += "META-INF/DEPENDENCIES"
            excludes += "META-INF/NOTICE"
            excludes += "META-INF/NOTICE.txt"
            excludes += "META-INF/LICENSE"
            excludes += "META-INF/LICENSE.txt"
            excludes += "META-INF/AL2.0"
            excludes += "META-INF/LGPL2.1"
            excludes += "DebugProbesKt.bin"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'

    // 仅注解（@RequiresApi）供 lint 识别 API 级别守卫；compileOnly 不打包进 APK，
    // 不引入任何运行时类，不影响"避免与宿主进程 classloader 冲突"的最小依赖约束
    compileOnly 'androidx.annotation:annotation:1.6.0'

    implementation 'com.hierynomus:smbj:0.13.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.mozilla:rhino:1.9.1'
}
