name: Build Release APK

# 触发：推送 v* tag 自动构建并发布 Releases。
#   - vX.Y.Z（如 v0.9.0）→ 正式版（Latest 标识）
#   - vX.Y.Z-后缀（如 v0.9.0-beta.1 / v0.9.0-rc.2）→ 预发布版（自动标记 prerelease，
#     不占 Latest；GitHub releases/latest 接口不返回 pre-release，正式版用户不会收到 beta 更新提示）
# workflow_dispatch 可手动触发（仅构建并上传 artifact，不发布）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components (platform-36 + build-tools 36.0.0)
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" --sdk_root="$ANDROID_HOME"
          yes | sdkmanager --licenses --sdk_root="$ANDROID_HOME" > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # release 签名：从 GitHub Secrets 注入。
      # 需配置：KEYSTORE_BASE64(keystore 文件 base64)、KEYSTORE_PASSWORD、KEY_ALIAS、KEY_PASSWORD。
      # 未配置时构建未签名 APK 并告警（无法安装，仅存档）。
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > src/keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > src/keystore.properties
            echo "::notice::Release signing configured from secrets"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - building UNSIGNED release APK"
          fi

      # 从 tag 自动同步版本号：
      #   v0.2.1         → versionName "0.2.1"、versionCode 201（主*10000+次*100+补丁）
      #   v0.2.1-beta.1  → versionName "0.2.1-beta.1"、versionCode 201（pre-release 与目标正式版共享 versionCode，
      #                     测试用户升级正式版时同版本号可覆盖安装，无需卸载；若系统拒绝则卸载重装）
      # 仅 tag 触发时执行；workflow_dispatch 手动触发时沿用仓库内版本号。
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::Tag format must be vX.Y.Z or vX.Y.Z-pre (got: $GITHUB_REF_NAME)"
            exit 1
          fi
          # 切掉 pre-release 后缀取纯数字核心（0.9.0-beta.1 → 0.9.0）用于 versionCode 计算
          CORE="${VERSION%%[-]*}"
          MAJOR="${CORE%%.*}"; REST="${CORE#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" src/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" src/app/build.gradle
          echo "::notice::Version synced from tag: versionName=$VERSION versionCode=$VERSION_CODE"
          grep -E "versionCode|versionName" src/app/build.gradle

      - name: Build release APK
        run: |
          cd src
          chmod +x gradlew
          ./gradlew assembleRelease

      # APK 文件名与软件名（应用名 miback_sly）一致，并携带版本号：
      # 有签名 → miback_sly-<versionName>.apk；未签名 → miback_sly-<versionName>-unsigned.apk
      - name: Compute APK base name
        id: apkname
        run: |
          VERSION="$(grep -E 'versionName' src/app/build.gradle | head -1 | sed -E 's/.*versionName[[:space:]]+"([^"]+)".*/\1/')"
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to read versionName from build.gradle"
            exit 1
          fi
          echo "base=miback_sly-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::APK base name: miback_sly-${VERSION}"

      - name: Rename release APK to match app name
        run: |
          cd src/app/build/outputs/apk/release
          if [ -f "app-release.apk" ]; then
            mv "app-release.apk" "${{ steps.apkname.outputs.base }}.apk"
          elif [ -f "app-release-unsigned.apk" ]; then
            mv "app-release-unsigned.apk" "${{ steps.apkname.outputs.base }}-unsigned.apk"
          else
            echo "::error::No release APK found to rename"
            ls -la
            exit 1
          fi
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: miback-sly-apk
          path: src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: src/app/build/outputs/apk/release/*.apk
          # tag 含 "-"（如 v0.9.0-beta.1）→ pre-release；正式版（vX.Y.Z）→ 普通 Release
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
